name: Project module layout
on:
  push:
    branches: [main]
    paths:
      - 'project-layout.toml'
      - 'docs/**'
      - 'tools/**'
      - 'frontend/src/**'
      - 'backend/**'
      - 'scheduler/**'
      - '.github/workflows/layout-ci.yml'
  pull_request:
    paths:
      - 'project-layout.toml'
      - 'docs/**'
      - 'tools/**'
      - 'frontend/src/**'
      - 'backend/**'
      - 'scheduler/**'
      - '.github/workflows/layout-ci.yml'
concurrency:
  group: layout-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_layout.py
      - run: python -m unittest discover -s tools/tests -v
