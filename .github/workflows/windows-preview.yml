name: Windows unsigned preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 preview
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install backend packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend pyinstaller

      - name: Generate native icons
        run: python tools/generate-desktop-icons.py

      - name: Build native API sidecar
        run: python tools/build-sidecar.py --target x86_64-pc-windows-msvc

      - name: Verify sidecar exists
        shell: pwsh
        run: |
          $file = 'frontend/src-tauri/binaries/lumacarve-api-x86_64-pc-windows-msvc.exe'
          if (!(Test-Path $file)) { throw "Missing Windows API sidecar: $file" }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build unsigned NSIS
        working-directory: frontend
        run: npm run desktop:build -- --config src-tauri/tauri.windows.conf.json

      - name: Validate and hash preview installer
        shell: pwsh
        run: |
          $dir = 'frontend/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $dir -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw 'No NSIS installer was produced' }
          New-Item -ItemType Directory -Path preview-artifacts -Force | Out-Null
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'NotSigned') {
              throw "Preview installer must be unsigned: $($installer.Name) ($($signature.Status))"
            }
            Copy-Item $installer.FullName -Destination preview-artifacts
            $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Add-Content -Path preview-artifacts/SHA256SUMS.txt -Encoding utf8
          }

      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: LumaCarve-windows-x64-unsigned-preview
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
