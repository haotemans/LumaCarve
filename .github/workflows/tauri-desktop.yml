name: Tauri 2 Linux desktop installers

# Deliberately dispatch-only: package builds are expensive and are not
# automatically repeated for every PR, push, or merge.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bundle:
    name: Build Linux x64 deb and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - name: Freeze FastAPI sidecar and generate icons
        run: |
          python -m pip install --disable-pip-version-check -e ./backend pyinstaller
          python tools/generate-desktop-icons.py
          python tools/build-sidecar.py --target x86_64-unknown-linux-gnu
      - name: Install frontend dependencies and run tests
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm run test
      - name: Bundle Linux installers
        working-directory: frontend
        run: npm run desktop:build -- --bundles deb,appimage
      - name: Verify Linux installer artifacts
        shell: bash
        run: |
          set -euo pipefail
          deb_dir=frontend/src-tauri/target/release/bundle/deb
          appimage_dir=frontend/src-tauri/target/release/bundle/appimage
          test "$(find "$deb_dir" -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 1
          test "$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -eq 1
          sha256sum "$deb_dir"/*.deb "$appimage_dir"/*.AppImage > SHA256SUMS.txt
      - name: Upload Linux packages and checksums
        uses: actions/upload-artifact@v4
        with:
          name: LumaCarve-Linux-deb-AppImage
          path: |
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
