name: Tauri 2 desktop installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tools/build-sidecar.py'
      - 'tools/generate-desktop-icons.py'
      - '.github/workflows/tauri-desktop.yml'
  push:
    branches: ['main', 'feat/tauri2-vue-desktop-bundles']
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tools/build-sidecar.py'
      - 'tools/generate-desktop-icons.py'
      - '.github/workflows/tauri-desktop.yml'
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - name: Freeze FastAPI and generate icons
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./backend pyinstaller
          python tools/generate-desktop-icons.py
          python tools/build-sidecar.py --target '${{ matrix.target }}'
      - name: Build/test Vue 3
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run build
      - name: Bundle unsigned installer
        working-directory: frontend
        run: npm run desktop:build -- --bundles '${{ matrix.bundles }}'
      - name: Verify Windows installer has no Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'frontend/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unsigned preview must be unsigned: $($signature.Status)" }
      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LumaCarve-Windows-NSIS
          path: frontend/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: LumaCarve-Linux-deb-AppImage
          path: |
            frontend/src-tauri/target/release/bundle/deb/*
            frontend/src-tauri/target/release/bundle/appimage/*
          if-no-files-found: error
  publish-preview:
    name: Publish desktop preview to GitHub Releases
    needs: bundle
    # Installer publishing is deliberately impossible from pull requests.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Windows and Linux installers
        uses: actions/download-artifact@v4
        with:
          pattern: LumaCarve-*
          path: release-artifacts
      - name: Verify both platforms and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' windows < <(find release-artifacts/LumaCarve-Windows-NSIS -type f -name '*.exe' -print0)
          mapfile -d '' debs < <(find release-artifacts/LumaCarve-Linux-deb-AppImage -type f -name '*.deb' -print0)
          mapfile -d '' appimages < <(find release-artifacts/LumaCarve-Linux-deb-AppImage -type f -name '*.AppImage' -print0)
          if [[ ${#windows[@]} -ne 1 || ${#debs[@]} -ne 1 || ${#appimages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one NSIS .exe, one .deb and one .AppImage from the same commit"
            find release-artifacts -type f -print
            exit 1
          fi
          mkdir -p release-files
          cp -- "${windows[0]}" release-files/
          cp -- "${debs[0]}" release-files/
          cp -- "${appimages[0]}" release-files/
          cd release-files
          sha256sum ./*.exe ./*.deb ./*.AppImage > SHA256SUMS.txt
          ls -lh
      - name: Publish v0.2.1 unsigned desktop preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.2.1-desktop-preview.1
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace tested artifacts"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-files/* \
            --target "$GITHUB_SHA" \
            --title "LumaCarve v0.2.1 Desktop Preview 1" \
            --notes-file docs/releases/v0.2.1-desktop-preview.1.md \
            --prerelease
