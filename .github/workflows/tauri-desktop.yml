name: Tauri 2 Linux portable AppImage

# Manually dispatched normally; a one-time release-notes commit triggers
# the Linux-only portable prerelease pipeline on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.2.2-portable.md'

permissions:
  contents: write

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bundle:
    name: Build Linux x64 portable AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - name: Freeze FastAPI sidecar and generate icons
        run: |
          python -m pip install --disable-pip-version-check -e './backend[dev]' pyinstaller
          python -m unittest discover -s backend/tests -q
          python tools/generate-desktop-icons.py
          python tools/build-sidecar.py --target x86_64-unknown-linux-gnu
      - name: Verify portable Rust directory selection
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --release portable_tests
      - name: Install frontend dependencies and run tests
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npm run test
      - name: Bundle Linux portable AppImage
        working-directory: frontend
        run: npm run desktop:build -- --bundles appimage
      - name: Verify Linux portable artifact
        shell: bash
        run: |
          set -euo pipefail
          appimage_dir=frontend/src-tauri/target/release/bundle/appimage
          test "$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -eq 1
          appimage=$(find "$appimage_dir" -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          test -s "$appimage"
          file "$appimage" | grep -q 'ELF 64-bit'
          chmod +x "$appimage"
          sha256sum "$appimage" | sed 's|.*/||' > SHA256SUMS.txt
          (cd "$appimage_dir" && sha256sum -c "$GITHUB_WORKSPACE/SHA256SUMS.txt")
          extract_dir=$(mktemp -d)
          (cd "$extract_dir" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          test -d "$extract_dir/squashfs-root"
          find "$extract_dir/squashfs-root" -type f -name 'lumacarve-api*' | grep -q .
          rm -rf "$extract_dir"
      - name: Upload Linux portable package and checksums
        uses: actions/upload-artifact@v4
        with:
          name: LumaCarve-Linux-x64-Portable-AppImage
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish Linux-only portable prerelease
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.2.2-portable-preview.1
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace immutable assets"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG exists; refusing to move it"
            exit 1
          fi
          appimage_dir=frontend/src-tauri/target/release/bundle/appimage
          mapfile -d '' appimages < <(find "$appimage_dir" -maxdepth 1 -type f -name '*.AppImage' -print0)
          test "${#appimages[@]}" -eq 1
          gh release create "$RELEASE_TAG" "${appimages[0]}" SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "LumaCarve v0.2.2 Portable Preview 1 (Linux x64 only)" \
            --notes-file docs/releases/v0.2.2-portable.md \
            --prerelease
