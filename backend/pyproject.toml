[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumacarve-backend"
version = "0.1.0"
description = "LumaCarve local image creation and LoRA training backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.18,<1",
    "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["lumacarve_runtime", "lumacarve_server"]
