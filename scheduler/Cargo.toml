[package]
name = "lumacarve-scheduler"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "LumaCarve deterministic graph and resource scheduling core"
license = "MIT"

[lib]
name = "lumacarve_scheduler"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
