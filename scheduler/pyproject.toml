[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "lumacarve-scheduler"
version = "0.1.0"
requires-python = ">=3.11"
description = "Optional Rust scheduling extension for LumaCarve"

[tool.maturin]
features = ["python"]
module-name = "lumacarve_scheduler"
manifest-path = "Cargo.toml"
bindings = "pyo3"
